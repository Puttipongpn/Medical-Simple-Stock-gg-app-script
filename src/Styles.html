<style>
  :root {
    color-scheme: light;
    --color-primary: #125b63;
    --color-hover: #0b444b;
    --color-background: #f1f5f7;
    --color-surface: #ffffff;
    --color-text: #182f3b;
    --color-muted: #50646f;
    --color-border: #b8c9ce;
    --color-soft: #e3eff0;
    --color-danger: #a32432;
    --color-focus: #245cc0;
    --scrollbar-thumb: #697e87;
    --scrollbar-track: #e3eff0;
    --scrollbar-hover: #50646f;
    --scrollbar-active: #182f3b;
    --font-body: Tahoma, "Leelawadee UI", sans-serif;
    --font-heading: "Leelawadee UI", Tahoma, sans-serif;
    --font-mono: Consolas, monospace;
    --radius-control: 6px;
    --radius-panel: 12px;
    --space-gap: 24px;
    --page-max: 1120px;
    font-family: var(--font-body);
    color: var(--color-text);
    background: var(--color-background);
    font-size: 16px;
    line-height: 1.7;
    scrollbar-gutter: stable;
  }
  *, *::before, *::after { box-sizing: border-box; }
  * { scrollbar-width: auto; scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track); }
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: var(--radius-control); }
  ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
  ::-webkit-scrollbar-thumb:active { background: var(--scrollbar-active); }
  body { margin: 0; }
  main { max-width: var(--page-max); margin: 0 auto; padding: 40px 24px; }
  .page-header { border-left: 5px solid var(--color-primary); padding-left: 20px; margin-bottom: var(--space-gap); }
  .eyebrow { color: var(--color-primary); font-weight: bold; font-size: 14px; }
  .eyebrow span { display: inline-block; margin-left: 12px; font-family: var(--font-mono); }
  h1, h2 { font-family: var(--font-heading); line-height: 1.45; margin: 0 0 12px; }
  h1 { font-size: clamp(28px, 4vw, 38px); }
  h2 { font-size: 20px; }
  p { margin: 0 0 16px; }
  .notice { background: var(--color-soft); color: var(--color-primary); padding: 12px 18px; border-radius: var(--radius-control); margin-bottom: var(--space-gap); }
  .workspace { display: grid; grid-template-columns: 1.05fr 1fr; gap: var(--space-gap); align-items: start; }
  .panel { min-width: 0; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-panel); padding: 24px; }
  .muted, .help, footer { color: var(--color-muted); }
  .help { font-size: 13px; margin-top: 8px; }
  label { display: block; margin-bottom: 8px; font-weight: bold; }
  .secret-field { display: flex; gap: 8px; }
  input { min-width: 0; width: 100%; border: 1px solid var(--color-border); border-radius: var(--radius-control); padding: 10px 12px; font: inherit; background: var(--color-surface); color: var(--color-text); }
  input[aria-invalid="true"] { border-color: var(--color-danger); }
  button { border-radius: var(--radius-control); border: 1px solid var(--color-primary); padding: 10px 14px; min-height: 44px; font: inherit; font-size: 14px; font-weight: bold; cursor: pointer; }
  .primary { background: var(--color-primary); color: var(--color-surface); }
  .primary:hover:not(:disabled), .primary:active:not(:disabled) { background: var(--color-hover); }
  .secondary { background: var(--color-surface); color: var(--color-primary); }
  .secondary:hover:not(:disabled), .secondary:active:not(:disabled) { background: var(--color-soft); }
  .secret-field button { flex-shrink: 0; min-width: 100px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--color-focus); outline-offset: 3px; }
  .field-error { color: var(--color-danger); min-height: 24px; font-size: 13px; margin-bottom: 8px; }
  hr { border: 0; border-top: 1px solid var(--color-border); margin: 28px 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .section-title { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .tag { font-size: 12px; color: var(--color-primary); white-space: nowrap; }
  #status { min-height: 100px; padding: 14px; background: var(--color-soft); border-left: 3px solid var(--color-primary); overflow-wrap: anywhere; }
  #status[data-tone="error"] { color: var(--color-danger); border-left-color: var(--color-danger); }
  dl { margin: 0 0 20px; }
  dl > div { border-bottom: 1px solid var(--color-border); padding: 12px 0; }
  dt { font-size: 13px; color: var(--color-muted); }
  dd { margin: 3px 0 0; overflow-wrap: anywhere; min-height: 27px; }
  .technical { font-family: var(--font-mono), var(--font-body); font-size: 14px; }
  footer { font-size: 13px; margin-top: var(--space-gap); }
  @media (max-width: 760px) {
    main { padding: 24px 16px; }
    .workspace { grid-template-columns: 1fr; }
    .panel { padding: 20px; }
    .page-header { padding-left: 14px; }
  }
  @media (forced-colors: active) {
    * { scrollbar-color: auto; }
    button, input, .panel, #status { border: 1px solid CanvasText; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
